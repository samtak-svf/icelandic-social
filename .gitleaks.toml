title = "samtak-spjall gitleaks config"

[extend]
useDefault = true

# Synthetic values that trip a default rule but are not secrets go in an
# [[allowlists]] block here, each as the exact matched value with a reason,
# confirmed by running `gitleaks dir --config .gitleaks.toml -v .` rather than
# guessed. Never widen a regex to make a finding go away.

# core/Cargo.lock lists the crate "libcrux-secrets"; generic-api-key reads the
# next dependency name, "libcrux-sha3", as its value. A crate name, not a key.
[[allowlists]]
description = "crate name after libcrux-secrets in core/Cargo.lock"
paths = ['''^core/Cargo\.lock$''']
regexTarget = "match"
regexes = ['''libcrux-sha3''']

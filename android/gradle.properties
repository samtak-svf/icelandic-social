org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Every unit test run (and so `./gradlew check`) compares the screenshot tests
# against the committed baselines; `./gradlew recordRoborazziDebug` rewrites them.
roborazzi.test.verify=true
# One image per test, named ClassName.method.png.
roborazzi.record.namingStrategy=testClassAndMethod

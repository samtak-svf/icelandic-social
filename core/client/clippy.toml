# Files only in blobs.rs: a browser has no std::fs (wasm32 returns Unsupported
# at run time, not at build), so every other module goes through BlobStore.
# Tests may use files.
disallowed-methods = [
  { path = "std::fs::read", reason = "files belong in blobs.rs" },
  { path = "std::fs::read_to_string", reason = "files belong in blobs.rs" },
  { path = "std::fs::read_dir", reason = "files belong in blobs.rs" },
  { path = "std::fs::write", reason = "files belong in blobs.rs" },
  { path = "std::fs::copy", reason = "files belong in blobs.rs" },
  { path = "std::fs::rename", reason = "files belong in blobs.rs" },
  { path = "std::fs::metadata", reason = "files belong in blobs.rs" },
  { path = "std::fs::create_dir", reason = "files belong in blobs.rs" },
  { path = "std::fs::create_dir_all", reason = "files belong in blobs.rs" },
  { path = "std::fs::remove_file", reason = "files belong in blobs.rs" },
  { path = "std::fs::remove_dir", reason = "files belong in blobs.rs" },
  { path = "std::fs::remove_dir_all", reason = "files belong in blobs.rs" },
  { path = "std::fs::File::open", reason = "files belong in blobs.rs" },
  { path = "std::fs::File::create", reason = "files belong in blobs.rs" },
  { path = "std::fs::OpenOptions::open", reason = "files belong in blobs.rs" },
]

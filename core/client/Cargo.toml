[package]
name = "spjall-client"
description = "The client engine of decision 0018: identity, conversations, the outbox and sync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["sqlite3mc"]
sqlite3mc = ["spjall-store/sqlite3mc"]

[dependencies]
aes-gcm.workspace = true
base64.workspace = true
getrandom.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
spjall-envelope = { path = "../envelope" }
spjall-mls = { path = "../mls" }
spjall-store = { path = "../store" }
thiserror.workspace = true

# The clock in a browser (`clock.rs`); openmls already brings it there.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
web-time = "1"

[dev-dependencies]
openmls.workspace = true
spjall-mls = { path = "../mls", features = ["forge"] }
tempfile.workspace = true
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
ureq.workspace = true

[lints]
workspace = true

[package]
name = "spjall-store"
description = "The core's SQLite file (decision 0006)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# rusqlite's SQLite on wasm32 with SQLite3 Multiple Ciphers compiled in, so
# the store's `PRAGMA key` encrypts the file as SQLCipher does natively (0064).
sqlite3mc = ["dep:sqlite-wasm-rs", "sqlite-wasm-rs?/sqlite3mc"]

[dependencies]
rusqlite.workspace = true

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
sqlite-wasm-rs = { version = "0.5", default-features = false, optional = true }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true

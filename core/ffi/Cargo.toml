[package]
name = "spjall-ffi"
description = "The core as the apps see it, through UniFFI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# libspjall_core.so (Android), libspjall_core.a (iOS XCFramework), and an rlib
# for the tests.
name = "spjall_core"
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
spjall-envelope = { path = "../envelope" }
spjall-mls = { path = "../mls" }
spjall-store = { path = "../store" }
thiserror.workspace = true
uniffi.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints.rust]
# UniFFI's generated scaffolding is unsafe by nature; our own code is not.
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }

[workspace]
resolver = "3"
members = ["envelope", "mls", "store", "client", "ffi", "uniffi-bindgen", "xtask"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
anyhow = "1"
base64 = "0.23"
getrandom = "0.3"
openmls = "0.9.0"
openmls_basic_credential = "0.6.0"
openmls_rust_crypto = "0.6.0"
openmls_traits = "0.6.0"
proptest = "1"
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
uniffi = "0.32.2"
ureq = "3"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

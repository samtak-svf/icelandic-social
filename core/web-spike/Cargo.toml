[package]
name = "spjall-web-spike"
description = "The browser spike of docs/web-client-feasibility.md: spjall-mls on wasm32 against a native peer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# rusqlite's SQLite on wasm32 with SQLite3 Multiple Ciphers compiled in, so
# the store's `PRAGMA key` encrypts the file as SQLCipher does natively.
sqlite3mc = ["sqlite-wasm-rs/sqlite3mc"]

[dependencies]
spjall-envelope = { path = "../envelope" }
spjall-mls = { path = "../mls" }
spjall-store = { path = "../store" }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
sqlite-wasm-rs = { version = "0.5", default-features = false }
wasm-bindgen = "=0.2.129"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile.workspace = true

[lints.rust]
# wasm-bindgen's generated glue is unsafe by nature; our own code is not.
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }

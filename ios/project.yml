# XcodeGen spec; the .xcodeproj is generated (`xcodegen` in ios/) and never
# committed. Nothing here names the brand: the display name, icon and colours
# come from Generated/ (pnpm brand:gen), the bundle ids from
# Generated/Ids.xcconfig (identifiers/ids.json).
#
# Packages/SpjallCore is written by `cargo xtask core ios` or
# `cargo xtask fetch ios` from core/; Xcode never builds the core itself.
name: Spjall
options:
  # The brand strings are Icelandic (Generated/Localizable.xcstrings).
  developmentLanguage: is
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"

configs:
  Debug: debug
  Release: release
  # Signed TestFlight builds on the interim team (decision 0011); only
  # ios-testflight.yml builds it.
  Interim: release

configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
  Interim: Config/Interim.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: 1
    # Unsigned until Samtak svf.'s Apple team exists (decision 0010); the
    # release workflow that signs arrives with it. Only Interim signs.
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
  configs:
    Interim:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: Apple Distribution
      CODE_SIGNING_REQUIRED: "YES"
      CODE_SIGNING_ALLOWED: "YES"

packages:
  SpjallCore:
    path: Packages/SpjallCore
  SpjallAPI:
    path: Packages/SpjallAPI

targets:
  Spjall:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Generated/BrandTokens.swift
      - path: Generated/Localizable.xcstrings
      - path: Generated/Assets.xcassets
      # The brand's font files and licences, copied as one Fonts folder;
      # Typefaces.register() loads the faces BrandTokens.FontFiles lists.
      - path: Generated/Fonts
        type: folder
        buildPhase: resources
    dependencies:
      - package: SpjallCore
      - package: SpjallAPI
      - target: NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SPJALL_BUNDLE_ID)
        # iPhone only. XcodeGen's iOS preset sets "1,2" on each target, which
        # hides a project-level value.
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_FILE: App/Info.plist
        # The brand's primary (Generated/Assets.xcassets), so alerts, dialogs
        # and system controls never show the system blue.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: App/Spjall.entitlements
        # APNs' sandbox for development builds (decision 0025).
        SPJALL_APS_ENVIRONMENT: production
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # The key asks whether App Store Connect needs export documentation, not
        # whether the encryption is exempt. MLS uses standard algorithms and the
        # app is not offered in France, so none is needed (decision 0002).
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
      configs:
        Debug:
          SPJALL_APS_ENVIRONMENT: development
        Interim:
          # XcodeGen's iOS preset sets CODE_SIGN_IDENTITY on each target, which
          # hides the project-level Interim value, so the targets repeat it.
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: $(SPJALL_APP_PROFILE)
          # Interim pushes through the interim team's APNs key (decision 0011),
          # so it signs App/Spjall.entitlements with production APNs, as Release.
    scheme:
      testTargets:
        - SpjallTests

  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
      - path: Shared
      # The labels a notice needs ("Mynd", "Skrá").
      - path: Generated/Localizable.xcstrings
    # It opens the same store as the app (decision 0016).
    dependencies:
      - package: SpjallCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SPJALL_NSE_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_FILE: NotificationService/Info.plist
        CODE_SIGN_ENTITLEMENTS: NotificationService/NotificationService.entitlements
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
      configs:
        Interim:
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: $(SPJALL_NSE_PROFILE)

  SpjallTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Spjall
      - package: SpjallCore
      - package: SpjallAPI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SPJALL_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: "YES"

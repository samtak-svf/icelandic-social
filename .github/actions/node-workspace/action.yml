name: Node workspace
description: >
  pnpm, Node and the workspace's dependencies, installed from the lockfile.
  Run it after actions/checkout (a local action needs the repo on disk).
  pnpm goes to a per-runner directory because the samtak-mac runners share one
  home directory. The Node version is pinned here, once.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        # Per runner: the Mac's two runners share one home directory.
        dest: ${{ runner.temp }}/setup-pnpm

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: pnpm

    - name: Install the workspace from the lockfile
      shell: bash
      run: pnpm install --frozen-lockfile

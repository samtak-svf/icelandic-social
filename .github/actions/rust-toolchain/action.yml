name: Rust toolchain
description: >
  The toolchain core/rust-toolchain.toml pins, usable from any directory. A
  runner whose rustup has no default toolchain (samtak-mac, installed with
  --default-toolchain none) cannot run `rustc` outside core/, which is where
  Swatinem/rust-cache runs `rustc -vV`; RUSTUP_TOOLCHAIN fixes that. A runner
  with no rustup at all (a slim image) gets it bootstrapped.
  Run it after checkout and before Swatinem/rust-cache.

inputs:
  targets:
    description: Space-separated extra targets, e.g. wasm32-unknown-unknown.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install rustup when the runner has none
      shell: bash
      run: |
        if ! command -v rustup >/dev/null; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        fi

    - name: Install the pinned toolchain
      shell: bash
      working-directory: core
      env:
        TARGETS: ${{ inputs.targets }}
      run: |
        export PATH="$HOME/.cargo/bin:$PATH"
        rustup toolchain install
        for target in $TARGETS; do rustup target add "$target"; done
        # Name the pinned toolchain for every directory, not only core/.
        echo "RUSTUP_TOOLCHAIN=$(rustup show active-toolchain | cut -d' ' -f1)" >> "$GITHUB_ENV"

name: Rust toolchain
description: >
  The toolchain core/rust-toolchain.toml pins, usable from any directory. A
  runner whose rustup has no default toolchain (samtak-mac, installed with
  --default-toolchain none) cannot run `rustc` outside core/, which is where
  Swatinem/rust-cache runs `rustc -vV`; RUSTUP_TOOLCHAIN fixes that. A runner
  with no rustup at all (a slim image) gets it bootstrapped. A self-hosted
  runner gets a CARGO_HOME of its own, because the samtak-mac runners share one
  $HOME and rust-cache's post step cleans the registry and cargo/bin.
  Run it after checkout and before Swatinem/rust-cache, taiki-e/install-action
  or `cargo install` (tooling/workflow-guard.mjs, rule 8).

inputs:
  targets:
    description: Space-separated extra targets, e.g. wasm32-unknown-unknown.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install rustup when the runner has none
      shell: bash
      run: |
        if ! command -v rustup >/dev/null; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        fi

    # Two jobs on one Mac shared ~/.cargo, and the post step of one job's
    # rust-cache deleted registry sources and installed tools (cargo-llvm-cov)
    # while the other was building. The rustup proxies stay in ~/.cargo/bin
    # and the toolchains in the shared RUSTUP_HOME; only what cargo writes
    # moves.
    - name: A CARGO_HOME for this runner alone
      if: runner.environment == 'self-hosted'
      shell: bash
      run: |
        home="$HOME/.cargo-runners/$RUNNER_NAME"
        mkdir -p "$home/bin"
        echo "CARGO_HOME=$home" >> "$GITHUB_ENV"
        echo "$home/bin" >> "$GITHUB_PATH"

    - name: Install the pinned toolchain
      shell: bash
      working-directory: core
      env:
        TARGETS: ${{ inputs.targets }}
      run: |
        export PATH="$HOME/.cargo/bin:$PATH"
        rustup toolchain install
        for target in $TARGETS; do rustup target add "$target"; done
        # Name the pinned toolchain for every directory, not only core/.
        echo "RUSTUP_TOOLCHAIN=$(rustup show active-toolchain | cut -d' ' -f1)" >> "$GITHUB_ENV"

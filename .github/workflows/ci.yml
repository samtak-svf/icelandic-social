name: CI

# Runs on EVERY pull request, with no path filter: a filtered-out PR produces
# no `check` run, so `check` could not be a required status check without
# blocking docs-only PRs forever (samtak-vefur ci.yml, dependabot #69).
#
# Path-filtered workflows (contract, backend, core, android, ios) arrive with
# the code they build; this one owns the repo-wide invariants: frozen ids,
# brand completeness and contrast, brand leaks, PII, þankastrik, lint, types
# and the guards' own tests.

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]
  # Daily, because a merge the gate skips writes no cache, and PRs restore main's.
  schedule:
    - cron: "23 4 * * *"

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # A merge whose tree a green PR run tested starts nothing (tooling/tree-proof.mjs).
  gate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/tree-proof.yml
    with:
      workflow: ci
      mode: gate

  check:
    # RUNNER_LABELS: hosted unless set, and always hosted for a fork's PR
    # (tooling/workflow-guard.mjs).
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' }}
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '["ubuntu-latest"]' || vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # ids-freeze --base needs the merge base with main.
          fetch-depth: 0

      - uses: ./.github/actions/node-workspace

      - name: Guards, lint, types, format
        run: pnpm run check

      - name: Frozen ids changed only with a decision record
        if: github.event_name == 'pull_request'
        run: node tooling/ids-freeze.mjs --base origin/${{ github.base_ref }}

      - name: A test that caught a bug is kept or retired with a reason
        if: github.event_name == 'pull_request'
        run: node tooling/critical-rules.mjs --base origin/${{ github.base_ref }}

      - name: Guard tests
        run: pnpm test

  secrets:
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '["ubuntu-latest"]' || vars.GUARD_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks over the PR range
        env:
          GITLEAKS_VERSION: 8.30.1
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || 'HEAD~1..HEAD' }}
        run: |
          set -euo pipefail
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) asset=linux_x64 ;;
            macOS-ARM64) asset=darwin_arm64 ;;
            *) echo "::error::no gitleaks build for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
          esac
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_${asset}.tar.gz" | tar -xz gitleaks
          ./gitleaks git --redact --verbose --config .gitleaks.toml --log-opts="$RANGE" .

  # Named one by one: the default success() also reads the skipped gate above them.
  proof:
    needs: [check]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.check.result == 'success' }}
    permissions:
      contents: read
      actions: read # asked of the whole called file, though only its gate job reads
    uses: ./.github/workflows/tree-proof.yml
    with:
      workflow: ci
      mode: prove

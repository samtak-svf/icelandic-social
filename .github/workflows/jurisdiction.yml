name: jurisdiction

# Asks Cloudflare whether the D1 database and the R2 bucket
# backend/cloudflare.config.ts binds exist in the EU jurisdiction (decision
# 0001). Skipped until the read-only token is set; from then on a missing or
# non-EU resource fails. It reads a secret, so it stays on a hosted runner: no
# secret reaches samtak-mac (tooling/workflow-guard.mjs, rule 4).
#
# Not on PRs. The gate that matters is the deploy workflow, which runs
# `jurisdiction-check.mjs --deploy --live` before every deploy and fails
# closed, and ci.yml checks the config itself on every PR. A PR cannot move a
# resource; it can only change the config or the check, so this runs when one
# of those reaches main, weekly to catch drift on Cloudflare's side, and by
# hand.

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "backend/cloudflare.config.ts"
      - "identifiers/**"
      - "tooling/jurisdiction-check.mjs"
      - ".github/workflows/jurisdiction.yml"
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

concurrency:
  group: jurisdiction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_JURISDICTION_TOKEN: ${{ secrets.CLOUDFLARE_JURISDICTION_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.CLOUDFLARE_JURISDICTION_TOKEN != ''

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: env.CLOUDFLARE_JURISDICTION_TOKEN != ''
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.CLOUDFLARE_JURISDICTION_TOKEN != ''
        with:
          node-version: 24
          cache: pnpm
      # The config imports `cf/config`, so the check needs the backend's packages.
      - if: env.CLOUDFLARE_JURISDICTION_TOKEN != ''
        run: pnpm install --frozen-lockfile

      - name: D1 and R2 report jurisdiction eu
        if: env.CLOUDFLARE_JURISDICTION_TOKEN != ''
        run: node tooling/jurisdiction-check.mjs --live

      - name: Not configured yet
        if: env.CLOUDFLARE_JURISDICTION_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_JURISDICTION_TOKEN is not set; the live check runs once D1 and R2 exist."

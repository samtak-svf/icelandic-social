name: ios-testflight

# A signed TestFlight build on the interim Apple team (decision 0011), with the
# interim ids from identifiers/ids.json (appleInterim), never the frozen ones.
# Manual only: each run signs a build and can upload it to TestFlight.
#
# The signing material is the interim team's, scoped to the team rather than
# to an app (docs/store-accounts/): the Apple Distribution certificate as a
# .p12 and an App Store Connect API key. The provisioning profiles are named
# after the bundle ids ("<bundle id> appstore"), the names IdsInterim.xcconfig and
# ExportOptions.Interim.plist expect (tooling/lib/brand-gen/ios.mjs).

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to TestFlight after the build
        type: boolean
        default: true

concurrency:
  group: ios-testflight
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.ids.outputs.app }}
      nse: ${{ steps.ids.outputs.nse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Interim ids
        id: ids
        run: |
          app=$(jq -r '.appleInterim.iosBundleId // empty' identifiers/ids.json)
          nse=$(jq -r '.appleInterim.iosNotificationServiceBundleId // empty' identifiers/ids.json)
          if [ -z "$app" ] || [ -z "$nse" ]; then
            echo "::error::identifiers/ids.json has no appleInterim; there is no interim team to sign for (decision 0011)"
            exit 1
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "nse=$nse" >> "$GITHUB_OUTPUT"

  build:
    needs: preflight
    runs-on: macos-26
    timeout-minutes: 60
    # The signing material is a whole team's, so it lives in an environment
    # (with required reviewers once the repo allows them), never in repo secrets.
    environment: testflight
    defaults:
      run:
        shell: bash
    steps:
      - name: Signing secrets present
        env:
          P12: ${{ secrets.IOS_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_SIGNING_P12_PASSWORD }}
          KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ISSUER: ${{ secrets.ASC_API_ISSUER_ID }}
          KEY: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          missing=()
          [ -n "$P12" ] || missing+=(IOS_SIGNING_P12_BASE64)
          [ -n "$P12_PASSWORD" ] || missing+=(IOS_SIGNING_P12_PASSWORD)
          [ -n "$KEY_ID" ] || missing+=(ASC_API_KEY_ID)
          [ -n "$ISSUER" ] || missing+=(ASC_API_ISSUER_ID)
          [ -n "$KEY" ] || missing+=(ASC_API_KEY_P8)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::missing secrets: ${missing[*]} (environment testflight, docs/store-accounts/)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Published core pinned
        id: lock
        run: |
          version=$(jq -r '.version // empty' core/artifact.lock.json)
          if [ -z "$version" ]; then
            echo "::error::core/artifact.lock.json pins no published core; a TestFlight build never builds its own"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/core-artifact
        with:
          target: ios
          token: ${{ github.token }}

      - name: Generate the Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Import the distribution certificate
        uses: apple-actions/import-codesign-certs@77ba2a2a8f5cfc8c405ebf3159f767c323e238f9 # v7.1.0
        with:
          p12-file-base64: ${{ secrets.IOS_SIGNING_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_SIGNING_P12_PASSWORD }}

      - name: Profile for ${{ needs.preflight.outputs.app }}
        uses: apple-actions/download-provisioning-profiles@230860ab5f632551a5f9a5e1d98a774485463888 # v7.0.0
        with:
          bundle-id: ${{ needs.preflight.outputs.app }}
          profile-type: IOS_APP_STORE
          issuer-id: ${{ secrets.ASC_API_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_API_KEY_ID }}
          api-private-key: ${{ secrets.ASC_API_KEY_P8 }}

      - name: Profile for ${{ needs.preflight.outputs.nse }}
        uses: apple-actions/download-provisioning-profiles@230860ab5f632551a5f9a5e1d98a774485463888 # v7.0.0
        with:
          bundle-id: ${{ needs.preflight.outputs.nse }}
          profile-type: IOS_APP_STORE
          issuer-id: ${{ secrets.ASC_API_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_API_KEY_ID }}
          api-private-key: ${{ secrets.ASC_API_KEY_P8 }}

      # The run number plus an offset is the build number: TestFlight refuses a
      # repeated one. The first repo's runs reached 34, and the count restarted
      # at 1 when the repo was recreated (decision 0075).
      # -skipPackagePluginValidation: see ios.yml.
      - name: Archive (Interim)
        working-directory: ios
        env:
          RUN_NUMBER: ${{ github.run_number }}
          BUILD_NUMBER_OFFSET: 100
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Spjall.xcodeproj \
            -scheme Spjall \
            -configuration Interim \
            -destination 'generic/platform=iOS' \
            -archivePath build/Spjall.xcarchive \
            -skipPackagePluginValidation \
            CURRENT_PROJECT_VERSION=$((RUN_NUMBER + BUILD_NUMBER_OFFSET)) \
            2>&1 | tee "$RUNNER_TEMP/archive.log" | xcpretty

      - name: Archive log on failure
        if: failure()
        run: |
          grep -nE "error:|warning: .*(sign|provision)" "$RUNNER_TEMP/archive.log" | tail -40 || true

      - name: Export the .ipa
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/Spjall.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist Generated/ExportOptions.Interim.plist \
            | xcpretty

      # The upload action refuses an app with no Test Information since v5.8.0.
      # This writes .apple-actions/test-information.json with the action's own
      # script, at the commit the upload step below is pinned to. Keep the two
      # the same: Dependabot rewrites only the `uses:` line.
      - name: Upload action's scripts
        if: inputs.upload
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: apple-actions/upload-testflight-build
          ref: 958b2fe4969e2ab1824f79f07c270b950f06bb3a
          path: build/upload-testflight-build
          persist-credentials: false

      - name: Test Information
        if: inputs.upload
        env:
          BUNDLE_ID: ${{ needs.preflight.outputs.app }}
          KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ISSUER: ${{ secrets.ASC_API_ISSUER_ID }}
          KEY: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          key="$RUNNER_TEMP/asc-key.p8"
          trap 'rm -f "$key"' EXIT
          (umask 077; printf '%s' "$KEY" > "$key")
          build/upload-testflight-build/scripts/populate-test-information.sh \
            --dir . \
            --config .apple-actions/test-information.json \
            --bundle-id "$BUNDLE_ID" \
            --apply \
            --issuer-id "$ISSUER" \
            --api-key-id "$KEY_ID" \
            --api-private-key-path "$key"

      - name: Upload to TestFlight
        if: inputs.upload
        uses: apple-actions/upload-testflight-build@958b2fe4969e2ab1824f79f07c270b950f06bb3a # v5.8.0
        with:
          app-path: ios/build/ipa/Spjall.ipa
          issuer-id: ${{ secrets.ASC_API_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_API_KEY_ID }}
          api-private-key: ${{ secrets.ASC_API_KEY_P8 }}

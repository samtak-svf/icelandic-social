name: rename-drill

# The rename drill (docs/decisions/0004): switch the tree to a generated
# _fixture brand, build the APK and the Worker bundle from it, and fail if
# either still carries a real brand's name. The leak guard in ci.yml proves
# the source is clean; this proves the built artifacts are, including
# anything a build step pulls in that the source scan cannot see.
#
# iOS is not built here: its brand outputs are covered by the source half,
# and an Xcode build per drill is not worth a macOS runner yet.

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "android/**"
      - "backend/**"
      - "brand/**"
      - "identifiers/**"
      - "tooling/**"
      - "core/artifact.lock.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/rename-drill.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "backend/**"
      - "brand/**"
      - "identifiers/**"
      - "tooling/**"
      - "core/artifact.lock.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/rename-drill.yml"

concurrency:
  group: rename-drill-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  drill:
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '["ubuntu-latest"]' || vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Per runner: the Mac's two runners share one home directory.
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Switch to the fixture brand
        run: node tooling/rename-drill.mjs prepare

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - name: Toolchain
        working-directory: core
        run: rustup toolchain install

      - name: Core (pinned, checksum-verified)
        working-directory: core
        run: cargo xtask fetch android
        env:
          GITHUB_TOKEN: ${{ github.token }} # the repo is private: its releases need a token
      - name: Core for the web (pinned, checksum-verified)
        working-directory: core
        run: cargo xtask fetch web
        env:
          GITHUB_TOKEN: ${{ github.token }} # the repo is private: its releases need a token

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: APK from the fixture
        working-directory: android
        run: ./gradlew --console=plain :app:assembleDebug

      # cf build bundles without talking to Cloudflare.
      - name: Worker bundle from the fixture
        working-directory: backend
        env:
          CF_SEND_TELEMETRY: "false"
        run: pnpm exec cf build

      # The Worker imports no brand string yet, so it can only prove absence.
      # Move it before --absent once it ships one (the push fallback).
      - name: No real brand in the artifacts
        run: >-
          node tooling/rename-drill.mjs scan
          android/app/build/outputs/apk/debug/app-debug.apk
          --absent backend/.cloudflare/output/v0/workers/default/bundle/index.js

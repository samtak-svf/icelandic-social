name: web

# The web client (decision 0062): it builds with the Worker, its unit tests
# pass, and Playwright signs in through it in Chromium. The Worker runs under
# `cf dev --mode interop` (backend/dev/worker.ts), the real Worker with the web
# app and fake Kenni and Google providers; web/e2e/origin.ts serves it as the
# web's real origin, so the session cookie and its Origin check are the ones
# production has. Nothing is deployed and no Cloudflare account is touched.

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "web/**"
      - "backend/**"
      - "api/**"
      - "identifiers/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/web.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "backend/**"
      - "api/**"
      - "identifiers/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/web.yml"

jobs:
  web:
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '["ubuntu-latest"]' || vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: The Worker builds, with the web app
        run: pnpm --filter spjall-backend build

      - name: Every page preloads the modules it loads
        run: node tooling/preload-check.mjs

      - name: Every script, style and wasm file is served with its integrity
        run: node tooling/sri-check.mjs

      - name: Unit tests
        run: pnpm --filter spjall-web test

      - name: Chromium
        run: pnpm --filter spjall-web exec playwright install --with-deps chromium

      - name: Start the Worker
        working-directory: backend
        timeout-minutes: 5
        run: |
          # As in interop.yml: the migrations go where cf dev keeps its state,
          # and the kennitala key is made for this run.
          node scripts/d1.ts migrate --local --persist-to .cloudflare/state
          printf 'KENNITALA_HMAC_KEY=%s\n' "$(openssl rand -hex 32)" > .dev.vars
          nohup pnpm exec cf dev --mode interop > "$RUNNER_TEMP/worker.log" 2>&1 &
          for _ in $(seq 60); do
            curl -sf -m 5 http://127.0.0.1:8787/health >/dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/worker.log"
          exit 1

      - name: Playwright
        run: pnpm --filter spjall-web e2e

      - name: Worker log
        if: failure() || cancelled()
        run: cat "$RUNNER_TEMP/worker.log"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

name: web

# The web client (decision 0062): it builds with the Worker, its unit tests
# pass, and Playwright signs in through it in Chromium. The Worker runs under
# `cf dev --mode interop` (backend/dev/worker.ts), the real Worker with the web
# app and fake Kenni and Google providers; web/e2e/origin.ts serves it as the
# web's real origin, so the session cookie and its Origin check are the ones
# production has. Nothing is deployed and no Cloudflare account is touched.

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "web/**"
      - "backend/**"
      - "api/**"
      - "identifiers/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/web.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "backend/**"
      - "api/**"
      - "identifiers/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/web.yml"

jobs:
  web:
    # Port 8787 and the AVD are one per machine, so this job takes the lane of
    # the single runner that holds them (EXCLUSIVE_RUNNER_LABELS, docs/testing.md).
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '["ubuntu-latest"]' || vars.EXCLUSIVE_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Per runner: the Mac's two runners share one home directory.
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The chat worker's core (decision 0081): the pinned build, checksum-verified.
      - uses: ./.github/actions/rust-toolchain
      - name: Core for the web (pinned, checksum-verified)
        working-directory: core
        run: cargo xtask fetch web
        env:
          GITHUB_TOKEN: ${{ github.token }} # the repo is private: its releases need a token

      - name: The Worker builds, with the web app
        run: pnpm --filter spjall-backend build

      - name: Every page preloads the modules it loads
        run: node tooling/preload-check.mjs

      - name: Every script, style and wasm file is served with its integrity
        run: node tooling/sri-check.mjs

      - name: Unit tests
        run: pnpm --filter spjall-web test

      - name: Chromium
        run: pnpm --filter spjall-web exec playwright install --with-deps chromium

      # The Worker under cf dev on fresh local state, then Playwright; the
      # same script the Mac runs (tooling/mac-remote.mjs web).
      - name: Playwright
        run: web/scripts/e2e.sh
        env:
          GITHUB_TOKEN: ${{ github.token }} # the script fetches the core again on a fresh checkout

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

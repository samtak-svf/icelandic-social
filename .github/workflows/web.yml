name: web

# The web client (decision 0062): it builds with the Worker, its unit tests
# pass, and Playwright signs in through it in Chromium. The Worker runs under
# `cf dev --mode interop` (backend/dev/worker.ts), the real Worker with the web
# app and fake Kenni and Google providers; web/e2e/origin.ts serves it as the
# web's real origin, so the session cookie and its Origin check are the ones
# production has. Nothing is deployed and no Cloudflare account is touched.

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "web/**"
      - "backend/**"
      - "api/**"
      - "identifiers/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/web.yml"
      - ".github/actions/core-artifact/**"
      - ".github/actions/node-workspace/**"
      - ".github/actions/rust-toolchain/**"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "backend/**"
      - "api/**"
      - "identifiers/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/web.yml"
      - ".github/actions/core-artifact/**"
      - ".github/actions/node-workspace/**"
      - ".github/actions/rust-toolchain/**"
  # Daily, because a merge the gate skips writes no cache, and PRs restore main's.
  schedule:
    - cron: "23 4 * * *"

concurrency:
  group: web-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # A merge whose tree a green PR run tested starts nothing (tooling/tree-proof.mjs).
  gate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/tree-proof.yml
    with:
      workflow: web
      mode: gate

  web:
    # The Worker takes a free port per run (backend/scripts/dev-worker.sh), so
    # this job shares the build lane with interop.
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' }}
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '["ubuntu-latest"]' || vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node-workspace

      # The chat worker's core (decision 0081): the pinned build, checksum-verified.
      - uses: ./.github/actions/core-artifact
        with:
          target: web
          token: ${{ github.token }}

      - name: The Worker builds, with the web app
        run: pnpm --filter spjall-backend build

      - name: Every page preloads the modules it loads
        run: node tooling/preload-check.mjs

      - name: Every script, style and wasm file is served with its integrity
        run: node tooling/sri-check.mjs

      - name: Unit tests
        run: pnpm --filter spjall-web test

      - name: Chromium
        run: pnpm --filter spjall-web exec playwright install --with-deps chromium

      # The Worker under cf dev on fresh local state, then Playwright; the
      # same script the Mac runs (tooling/mac-remote.mjs web).
      - name: Playwright
        run: web/scripts/e2e.sh
        env:
          GITHUB_TOKEN: ${{ github.token }} # the script fetches the core again on a fresh checkout

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  # Named one by one: the default success() also reads the skipped gate above them.
  proof:
    needs: [web]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.web.result == 'success' }}
    uses: ./.github/workflows/tree-proof.yml
    with:
      workflow: web
      mode: prove

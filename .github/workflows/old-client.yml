name: old-client

# The core of the oldest store release we keep working against the Worker of this
# tree (#396): a phone keeps that core until its owner updates, so a server change
# it cannot decode, or a row it must not get, breaks people the rest of CI never
# meets. The newest core is interop.yml's. tooling/old-client/release.json names
# the release and moves only by hand (docs/testing.md), old_client/ is the test,
# and it is compiled in a checkout of that tag, so it sees that release's API.
# Nothing is deployed; the Worker is local, with fake issuers (interop.yml).

permissions:
  contents: read

on:
  # No `paths` filter: a required check that a path filter keeps from running
  # never reports on a PR that touches neither, and that PR waits forever. The
  # `changes` job below decides instead, and a skipped job reports success.
  pull_request:
  # Daily on main: a cache a PR can read (the build of the tag is 10 minutes
  # without it).
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

concurrency:
  group: old-client-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CF_SEND_TELEMETRY: "false"
  # cf dev delegates to Wrangler, which has its own switch.
  WRANGLER_SEND_METRICS: "false"

jobs:
  # The decider. The paths are the ones the trigger used to filter on.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Did anything the test reads change
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          files=$(git diff --name-only "$BASE_SHA" HEAD)
          if printf '%s\n' "$files" | grep -Eq '^(backend/|api/|pnpm-lock\.yaml$|tooling/old-client/|\.github/workflows/old-client\.yml$|\.github/actions/(node-workspace|core-artifact|rust-toolchain)/)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  old-client:
    needs: changes
    # Skipped (which a required check reads as a pass) only when `changes`
    # succeeded and said nothing relevant changed. If `changes` failed or was
    # skipped, result is not 'success', so this runs: a broken decider cannot
    # read as a pass. !cancelled() so a failed need does not skip the job.
    if: >-
      !cancelled() && (
        github.event_name != 'pull_request' ||
        needs.changes.result != 'success' ||
        needs.changes.outputs.relevant == 'true'
      )
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '["ubuntu-latest"]' || vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node-workspace

      - name: The release
        id: release
        run: |
          echo "tag=$(jq -er .coreTag tooling/old-client/release.json)" >> "$GITHUB_OUTPUT"
          echo "SPJALL_OLD_APP=$(jq -er .appVersion tooling/old-client/release.json)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          path: .old-core

      # The toolchain, and the browser's core that cf dev serves from web/core.
      - uses: ./.github/actions/core-artifact
        with:
          target: web
          token: ${{ github.token }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: .old-core/core

      - name: Build the test while nothing else runs
        working-directory: .old-core/core
        run: |
          cp -r "$GITHUB_WORKSPACE/tooling/old-client/old_client" client/tests/old_client
          cargo test --locked -p spjall-client --test old_client --no-run

      - name: Start the Worker
        working-directory: backend
        timeout-minutes: 5
        run: |
          # As in interop.yml: the assignment first, since eval of a substitution
          # hides a failed start.
          started=$(scripts/dev-worker.sh start)
          eval "$started"
          export SPJALL_DEV_URL SPJALL_DEV_PORT
          if ! link=$(node scripts/invite-operator.ts --local); then
            cat .cloudflare/worker.log
            exit 1
          fi
          echo "SPJALL_INVITE=$link" >> "$GITHUB_ENV"

      - name: The release reads this Worker
        working-directory: .old-core/core
        run: cargo test --locked -p spjall-client --test old_client -- --ignored

      - name: Worker log
        if: failure() || cancelled()
        run: cat backend/.cloudflare/worker.log

      - name: Stop the Worker
        if: always()
        run: backend/scripts/dev-worker.sh stop

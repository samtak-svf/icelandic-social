name: deploy

# Deploys the Worker spjall-api to spjall.samtak.is: the way back recorded
# first (docs/operations.md), then remote D1 migrations, then the Worker. Started by hand only, from main, and held by the
# `production` environment until the maintainer approves the run; the
# Cloudflare API token lives in that environment and nowhere else.
#
# The checks before it refuse a config that would make `cf deploy` provision
# storage by itself (decision 0001): `--deploy` wants the D1 id and the custom
# domain, `--live` asks Cloudflare whether D1 and R2 really are in the EU.
#
# Secrets are not set here: `node tooling/worker-secrets.mjs` copies them from
# the vault (decision 0026), which this runner cannot read.

permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://spjall.samtak.is/health
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_SEND_TELEMETRY: "false"
      CLOUDFLARE_JURISDICTION_TOKEN: ${{ secrets.CLOUDFLARE_JURISDICTION_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node-workspace

      # The chat worker's core (decision 0081): the pinned build, checksum-verified.
      - uses: ./.github/actions/core-artifact
        with:
          target: web
          token: ${{ github.token }}

      - name: Deployable, and D1 and R2 report jurisdiction eu
        run: node tooling/jurisdiction-check.mjs --deploy --live

      - name: Types, OpenAPI drift and tests
        run: |
          pnpm --filter spjall-backend run check
          pnpm --filter spjall-backend test

      # The bookmark and the version a rollback goes back to, in the run's
      # summary before anything changes: ids only (decision 0068).
      - name: The way back
        working-directory: backend
        run: node scripts/ops.ts way-back >> "$GITHUB_STEP_SUMMARY"

      - name: Remote D1 migrations
        run: pnpm --filter spjall-backend run migrate:remote

      - name: Deploy
        run: pnpm --filter spjall-backend run deploy

      - name: The API answers on its host
        run: |
          for attempt in 1 2 3 4 5 6; do
            curl --fail --silent --show-error https://spjall.samtak.is/health && exit 0
            sleep 10
          done
          exit 1

      # What was deployed, hashed from the build output the deploy used (every
      # static asset and the Worker script), paths relative to its root. Done
      # here because only this job has the output (decision 0081).
      - name: Hash the deployed files
        run: |
          cd backend/.cloudflare/output
          test -n "$(find . -type f -print -quit)" || { echo "::error::no build output to hash"; exit 1; }
          find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sed 's|  \./|  |' > "$GITHUB_WORKSPACE/web-files.sha256"
          wc -l "$GITHUB_WORKSPACE/web-files.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-files
          path: web-files.sha256
          if-no-files-found: error

  # Publishes the hashes in a `web-v…` release for the commit just deployed,
  # so anyone can compare what the host serves with what was built (0081).
  # The only job that may write to the repository.
  release:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-files
          path: artifacts

      - name: Release the hashes, never overwriting
        run: |
          TAG="web-v$(date -u +%F)-${GITHUB_SHA:0:7}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::$TAG is already released"
            exit 1
          fi
          gh release create "$TAG" artifacts/web-files.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "web $TAG" \
            --notes "SHA-256 of every file the web app and Worker deployed from $GITHUB_SHA serve (decision 0081)."

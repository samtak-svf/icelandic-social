name: deploy

# Deploys the Worker spjall-api to spjall.samtak.is: remote D1 migrations
# first, then the Worker. Started by hand only, from main, and held by the
# `production` environment until the maintainer approves the run; the
# Cloudflare API token lives in that environment and nowhere else.
#
# The checks before it refuse a config that would make wrangler provision
# storage by itself (decision 0001): `--deploy` wants the D1 id and the custom
# domain, `--live` asks Cloudflare whether D1 and R2 really are in the EU.
#
# Secrets are not set here: `node tooling/worker-secrets.mjs` copies them from
# the vault (decision 0026), which this runner cannot read.

permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://spjall.samtak.is/health
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_JURISDICTION_TOKEN: ${{ secrets.CLOUDFLARE_JURISDICTION_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Deployable, and D1 and R2 report jurisdiction eu
        run: node tooling/jurisdiction-check.mjs --deploy --live

      - name: Types, OpenAPI drift and tests
        run: |
          pnpm --filter spjall-backend run check
          pnpm --filter spjall-backend test

      - name: Remote D1 migrations
        run: pnpm --filter spjall-backend run migrate:remote

      - name: Deploy
        run: pnpm --filter spjall-backend run deploy

      - name: The API answers on its host
        run: |
          for attempt in 1 2 3 4 5 6; do
            curl --fail --silent --show-error https://spjall.samtak.is/health && exit 0
            sleep 10
          done
          exit 1

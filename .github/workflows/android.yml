name: android

# The Android skeleton (android/): ktlint, detekt, Android Lint with warnings
# as errors, the unit tests, and a debug APK. The device job runs the
# instrumented tests, which load the core's .so, on an emulator.
#
# The core is the published release core/artifact.lock.json pins, fetched and
# checksum-verified by cargo xtask fetch (decision 0013); this workflow never
# builds it. A core change reaches the app as a new release and a lock PR, so
# only the lock and the fetch code are in the path filter. Gradle never calls
# cargo itself (tooling/core-guard.mjs).

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "android/**"
      - "brand/**"
      - "identifiers/**"
      - "api/**"
      - "core/artifact.lock.json"
      - "core/xtask/**"
      - "core/rust-toolchain.toml"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "brand/**"
      - "identifiers/**"
      - "api/**"
      - "core/artifact.lock.json"
      - "core/xtask/**"
      - "core/rust-toolchain.toml"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '["ubuntu-latest"]' || vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: ./.github/actions/core-artifact
        with:
          target: android
          token: ${{ github.token }}

      # On a self-hosted runner the persistent ~/.gradle is the cache, and the runners on one
      # Mac share it. With caching on, a default-branch build's post step stops every Gradle
      # daemon before saving, which killed a concurrent device job (run 40291150804, stopped
      # by run 40290692249). Disabled, the post step neither saves nor stops anything.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: ${{ runner.environment == 'self-hosted' }}
      - name: Check and assemble
        working-directory: android
        run: ./gradlew --console=plain check assembleDebug

      - name: Fail when no unit tests ran
        working-directory: android
        run: |
          COUNT=$(find . -path '*/build/test-results/*' -name 'TEST-*.xml' | wc -l)
          echo "unit test result files: $COUNT"
          test "$COUNT" -gt 0

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: android-reports
          # outputs/roborazzi holds a failed screenshot's actual and compare images.
          path: |
            android/**/build/reports/
            android/**/build/outputs/roborazzi/
          retention-days: 7

  device:
    # The AVD is one per machine (and the emulator reaches the dev Worker at
    # 10.0.2.2:8787), so this job takes the lane of the single runner that
    # holds them (EXCLUSIVE_RUNNER_LABELS, docs/testing.md).
    # On a hosted Linux runner the emulator needs KVM; on the Mac it is the
    # arm64 AVD android/scripts/test.sh boots, the script mac-remote.mjs runs.
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '["ubuntu-latest"]' || vars.EXCLUSIVE_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: ./.github/actions/core-artifact
        with:
          target: android
          token: ${{ github.token }}

      # Self-hosted: as in the build job, no cache and no daemon stop.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: ${{ runner.environment == 'self-hosted' }}
      - name: Enable KVM
        if: runner.os == 'Linux'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests (emulator)
        if: runner.os == 'Linux'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          working-directory: android
          script: ./gradlew --console=plain connectedDebugAndroidTest

      # One AVD per Mac, shared with agent runs (scripts/mac-remote.mjs in agent-config takes the
      # same lock, docs/samtak-mac-workloads.md there). The owner is this job's Runner.Worker
      # (--owner-ancestor), so a killed job's lock is stale at once. Until ~/remote/bin/mac-lock.sh
      # exists on the runner (mac-remote installs it) the step warns and goes on unlocked. So does
      # exit 2: a runner whose installed mac-lock.sh predates --owner-ancestor fails on the unknown
      # argument, and that must not fail the job.
      # --wait 1500 leaves the connected tests (10-15 min) inside the job's 45 min timeout, so a
      # long agent hold ends in a clean exit 3, not a job timeout.
      - name: Take the AVD lock
        if: runner.os == 'macOS'
        shell: bash
        env:
          LOCK_WHO: ci ${{ github.repository }} run ${{ github.run_id }}
        run: |
          lock="$HOME/remote/bin/mac-lock.sh"
          if [ ! -x "$lock" ]; then
            echo "::warning::$lock is missing, so the AVD is not locked against agent runs"
            exit 0
          fi
          rc=0
          "$lock" acquire android-avd --wait 1500 --owner-ancestor Runner.Worker --who "$LOCK_WHO" || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::warning::$lock refused its arguments (an older copy, or no Runner.Worker above this step), so the AVD is not locked against agent runs"
            exit 0
          fi
          exit "$rc"

      - name: Instrumented tests (the Mac's AVD)
        if: runner.os == 'macOS'
        run: android/scripts/test.sh --connected
        env:
          GITHUB_TOKEN: ${{ github.token }} # the script fetches the core again on a fresh checkout

      - name: Release the AVD lock
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          lock="$HOME/remote/bin/mac-lock.sh"
          [ -x "$lock" ] || exit 0
          # Exit 4: the lock is someone else's (this job never got it), leave it alone. Exit 2: no
          # lock was taken (older script, or no Runner.Worker above), nothing to release.
          rc=0
          "$lock" release android-avd --owner-ancestor Runner.Worker || rc=$?
          [ "$rc" -eq 0 ] || [ "$rc" -eq 2 ] || [ "$rc" -eq 4 ]

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: android-device-reports
          path: android/**/build/reports/androidTests/

name: android

# The Android skeleton (android/): ktlint, detekt, Android Lint with warnings
# as errors, the unit tests, and a debug APK. The device job runs the
# instrumented tests, which load the core's .so, on an emulator.
#
# The core is the published release core/artifact.lock.json pins, fetched and
# checksum-verified by cargo xtask fetch (decision 0013); this workflow never
# builds it. A core change reaches the app as a new release and a lock PR, so
# only the lock and the fetch code are in the path filter. Gradle never calls
# cargo itself (tooling/core-guard.mjs).

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "android/**"
      - "brand/**"
      - "identifiers/**"
      - "api/**"
      - "core/artifact.lock.json"
      - "core/xtask/**"
      - "core/rust-toolchain.toml"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "brand/**"
      - "identifiers/**"
      - "api/**"
      - "core/artifact.lock.json"
      - "core/xtask/**"
      - "core/rust-toolchain.toml"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '["ubuntu-latest"]' || vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Toolchain
        working-directory: core
        run: rustup toolchain install

      - name: Core (pinned, checksum-verified)
        working-directory: core
        run: cargo xtask fetch android

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Check and assemble
        working-directory: android
        run: ./gradlew --console=plain check assembleDebug

      - name: Fail when no unit tests ran
        working-directory: android
        run: |
          COUNT=$(find . -path '*/build/test-results/*' -name 'TEST-*.xml' | wc -l)
          echo "unit test result files: $COUNT"
          test "$COUNT" -gt 0

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: android-reports
          # outputs/roborazzi holds a failed screenshot's actual and compare images.
          path: |
            android/**/build/reports/
            android/**/build/outputs/roborazzi/
          retention-days: 7

  device:
    # The emulator needs KVM, which GitHub's hosted Linux runners have.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Toolchain
        working-directory: core
        run: rustup toolchain install

      - name: Core (pinned, checksum-verified)
        working-directory: core
        run: cargo xtask fetch android

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests (emulator)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          working-directory: android
          script: ./gradlew --console=plain connectedDebugAndroidTest

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: android-device-reports
          path: android/**/build/reports/androidTests/

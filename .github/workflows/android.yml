name: android

# The Android skeleton (android/): ktlint, detekt, Android Lint with warnings
# as errors, the unit tests, and a debug APK.
#
# The core comes from core/artifact.lock.json: the pinned published version
# when there is one (cargo xtask fetch, checksum-verified), otherwise a local
# build with the NDK the lock names. Gradle never calls cargo itself.

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "android/**"
      - "brand/**"
      - "identifiers/**"
      - "api/**"
      - "core/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "brand/**"
      - "identifiers/**"
      - "api/**"
      - "core/**"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '["ubuntu-latest"]' || vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Published core pinned?
        id: lock
        run: echo "version=$(jq -r '.version // empty' core/artifact.lock.json)" >> "$GITHUB_OUTPUT"

      - name: Toolchain
        working-directory: core
        run: rustup toolchain install

      - name: NDK from the lock, and cargo-ndk
        if: steps.lock.outputs.version == ''
        run: |
          NDK=$(jq -r .androidNdk core/artifact.lock.json)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK" > /dev/null
          cargo install cargo-ndk --version 4.1.2 --locked

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.lock.outputs.version == ''
        with:
          workspaces: core

      - name: Core (local build, nothing published yet)
        if: steps.lock.outputs.version == ''
        working-directory: core
        run: cargo xtask core android

      - name: Core (pinned ${{ steps.lock.outputs.version }})
        if: steps.lock.outputs.version != ''
        working-directory: core
        run: cargo xtask fetch android

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Check and assemble
        working-directory: android
        run: ./gradlew --console=plain check assembleDebug

      - name: Fail when no unit tests ran
        working-directory: android
        run: |
          COUNT=$(find . -path '*/build/test-results/*' -name 'TEST-*.xml' | wc -l)
          echo "unit test result files: $COUNT"
          test "$COUNT" -gt 0

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: android-reports
          path: android/**/build/reports/
          retention-days: 7

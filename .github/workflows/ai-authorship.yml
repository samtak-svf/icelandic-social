# Server-side guard against AI authorship markers.
#
# The lefthook `ai-authorship` and commit-msg checks are local, so a push from
# anywhere without the hooks gets past them. This workflow has no path filter,
# so a docs-only PR is checked too, and it looks at four things: the message,
# the author, the committer and the PR body.
name: ai-authorship

on:
  pull_request:
    # `edited` matters: a marker can be added to the PR body after opening,
    # which is exactly how #188 carried its "Generated by Claude Code" line.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  guard:
    # GUARD_RUNNER_LABELS: hosted unless set, and only ever set to the ephemeral GCP lane,
    # never to a workstation label: a guard checks out and runs a PR's contents.
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '["ubuntu-latest"]' || vars.GUARD_RUNNER_LABELS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole PR range has to be walkable, not just the tip.
          fetch-depth: 0

      - name: Commit messages, authors and committers
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          AI='Claude|Anthropic|Copilot|GPT|OpenAI|Gemini'
          failed=0

          # Identity: an AI must never be the author or the committer.
          while IFS='|' read -r sha an ae cn ce; do
            [ -n "$sha" ] || continue
            for field in "$an <$ae>" "$cn <$ce>"; do
              if printf '%s' "$field" | grep -qiE "$AI|noreply@anthropic\.com"; then
                echo "::error::$sha is attributed to an AI identity: $field"
                failed=1
              fi
            done
          done < <(git log --format='%H|%an|%ae|%cn|%ce' "$BASE..$HEAD")

          # Message: trailers, session pointers and generated-with footers.
          #
          # A marker is a STRUCTURAL element — a trailer or a footer holding its
          # own line. Prose that quotes one while documenting this very policy is
          # not an attribution and must not fail: an unanchored match makes the
          # rule unamendable, because every commit that explains it trips it.
          # This commit is the worked example.
          #
          # So the trailer checks defer to git's own parser, which recognises a
          # trailer only in the final paragraph and only at line start. Nothing
          # downstream reads a mid-sentence mention as attribution either, so
          # anchoring loses no coverage.
          while read -r sha; do
            [ -n "$sha" ] || continue
            trailers=$(git log -1 --format='%(trailers:only,unfold)' "$sha")
            if printf '%s' "$trailers" | grep -qiE "^Co-Authored-By:.*($AI)"; then
              echo "::error::$sha has an AI Co-Authored-By trailer"
              failed=1
            fi
            if printf '%s' "$trailers" | grep -qiE "^Claude-Session:|^[A-Za-z-]+:[[:space:]]*https://claude\.ai/"; then
              echo "::error::$sha references a Claude session"
              failed=1
            fi
            msg=$(git log -1 --format=%B "$sha")
            if printf '%s' "$msg" | grep -qiE "^[[:space:]]*(🤖[[:space:]]*)?Generated (with|by).*($AI)|^[[:space:]]*🤖"; then
              echo "::error::$sha has a generated-with footer"
              failed=1
            fi
          done < <(git log --format='%H' "$BASE..$HEAD")

          [ "$failed" -eq 0 ] || {
            echo "Commits list only human authors. Rewrite the offending commits" \
                 "(git rebase -i / commit --amend --reset-author) and force-push."
            exit 1
          }
          echo "✓ every commit in the range lists only human authors"

      - name: Pull request body
        env:
          # Via env, never interpolated into the script — a PR body is
          # untrusted input and `${{ }}` inside run: is a shell injection.
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          AI='Claude|Anthropic|Copilot|GPT|OpenAI|Gemini'
          # Anchored for the same reason as the commit checks above: a PR that
          # describes the policy quotes these strings, and must still pass.
          if printf '%s' "${BODY:-}" \
            | grep -qiE "^[[:space:]]*Co-Authored-By:.*($AI)|^[[:space:]]*(🤖[[:space:]]*)?Generated (with|by).*($AI)|^[[:space:]]*🤖|^[[:space:]]*Claude-Session:|^[[:space:]]*https://claude\.ai/"; then
            echo "::error::The pull request body carries an AI attribution marker"
            exit 1
          fi
          echo "✓ pull request body carries no AI attribution"

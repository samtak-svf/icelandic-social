name: interop

# The core's sync engine against the real Worker (decision 0018): the Worker
# runs under `cf dev --mode interop`, whose entry is backend/dev/worker.ts, the
# dev entry that shims the EU jurisdiction local workerd cannot pin and serves
# the fake Kenni (decision 0019), and core/client/tests/backend.rs signs five
# devices in through it, the first with an operator invite, and drives them
# over HTTP and the WebSocket. Nothing is deployed and no Cloudflare account is
# touched: D1 and the Durable Objects are local files under backend/.wrangler,
# and the kennitala key is made here for this run, in backend/.dev.vars.

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "core/**"
      - "backend/**"
      - "web/**"
      - "api/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/interop.yml"
  push:
    branches: [main]
    paths:
      - "core/**"
      - "backend/**"
      - "web/**"
      - "api/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/interop.yml"

concurrency:
  group: interop-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CF_SEND_TELEMETRY: "false"
  # cf dev delegates to Wrangler, which has its own switch.
  WRANGLER_SEND_METRICS: "false"

jobs:
  interop:
    # The Worker takes a free port per job (backend/scripts/dev-worker.sh), so
    # this job shares the build lane with web.
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '["ubuntu-latest"]' || vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Per runner: the Mac's two runners share one home directory.
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The wasm32 target also gives macOS Homebrew's clang for the browser
      # core's C (the action says why).
      - uses: ./.github/actions/rust-toolchain
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core

      - name: Build the test while nothing else runs
        working-directory: core
        run: cargo test --locked -p spjall-client --test backend --no-run

      # The browser's core from this tree, so a core change meets the browser
      # here (0081). cf dev serves web/core/, so it is built before the Worker
      # starts. wasm-bindgen-cli is the version in core/Cargo.lock (core.yml).
      - name: Core for the browser
        working-directory: core
        run: |
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
          cargo xtask core web

      - name: Start the Worker
        working-directory: backend
        timeout-minutes: 5
        run: |
          # A free port per job (backend/scripts/dev-worker.sh), exported to the
          # later steps as SPJALL_DEV_URL and SPJALL_DEV_PORT, and to this one
          # for the invite. The assignment comes first: eval of a substitution
          # hides a failed start.
          started=$(scripts/dev-worker.sh start)
          eval "$started"
          export SPJALL_DEV_URL SPJALL_DEV_PORT
          if ! link=$(node scripts/invite-operator.ts --local); then
            cat .cloudflare/worker.log
            exit 1
          fi
          echo "SPJALL_INVITE=$link" >> "$GITHUB_ENV"

      - name: Devices through the Worker
        working-directory: core
        run: cargo test --locked -p spjall-client --test backend -- --ignored

      # A real browser links from a phone's account and replies through the
      # core in its worker; the phone is backend.rs's a_phone_links_a_real_browser.
      - name: Chromium
        run: pnpm --filter spjall-web exec playwright install --with-deps chromium
      - name: A browser and a phone through the Worker
        env:
          SPJALL_BROWSER_PHONE: "1"
        run: pnpm --filter spjall-web exec playwright test e2e/chat.spec.ts

      - name: Worker log
        if: failure() || cancelled()
        run: cat backend/.cloudflare/worker.log

      - name: Stop the Worker
        if: always()
        run: backend/scripts/dev-worker.sh stop

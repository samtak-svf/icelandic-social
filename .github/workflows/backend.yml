name: backend

# The Worker spjall-api: types, the OpenAPI drift check, and its tests inside
# workerd. Path-filtered; the repo-wide seam and jurisdiction config checks
# run in ci.yml on every PR.
#
# Deploying is the `deploy` workflow's job, by hand and behind the
# `production` environment (backend/README.md).

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "backend/**"
      - "api/**"
      - "identifiers/**"
      - "tooling/jurisdiction-check.mjs"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "identifiers/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/backend.yml"

concurrency:
  group: backend-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '["ubuntu-latest"]' || vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Types and OpenAPI drift
        run: pnpm --filter spjall-backend run check

      - name: Tests in workerd
        run: pnpm --filter spjall-backend test

  # Asks Cloudflare whether the D1 database and the R2 bucket cloudflare.config.ts
  # binds exist in the EU jurisdiction. Skipped until the read-only token is set, which happens when
  # the resources are created; from then on a missing or non-EU resource fails.
  jurisdiction:
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '["ubuntu-latest"]' || vars.GUARD_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    env:
      CLOUDFLARE_JURISDICTION_TOKEN: ${{ secrets.CLOUDFLARE_JURISDICTION_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.CLOUDFLARE_JURISDICTION_TOKEN != ''

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: env.CLOUDFLARE_JURISDICTION_TOKEN != ''
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.CLOUDFLARE_JURISDICTION_TOKEN != ''
        with:
          node-version: 24
          cache: pnpm
      # The config imports `cf/config`, so the check needs the backend's packages.
      - if: env.CLOUDFLARE_JURISDICTION_TOKEN != ''
        run: pnpm install --frozen-lockfile

      - name: D1 and R2 report jurisdiction eu
        if: env.CLOUDFLARE_JURISDICTION_TOKEN != ''
        run: node tooling/jurisdiction-check.mjs --live

      - name: Not configured yet
        if: env.CLOUDFLARE_JURISDICTION_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_JURISDICTION_TOKEN is not set; the live check runs once D1 and R2 exist."

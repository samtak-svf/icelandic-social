name: backend

# The Worker spjall-api: types, the OpenAPI drift check, and its tests inside
# workerd. Path-filtered; the repo-wide seam and jurisdiction config checks
# run in ci.yml on every PR, and the live jurisdiction check in
# jurisdiction.yml.
#
# Deploying is the `deploy` workflow's job, by hand and behind the
# `production` environment (backend/README.md).

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "backend/**"
      - "web/**"
      - "api/**"
      - "identifiers/**"
      - "tooling/coverage-floor.*"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/backend.yml"
      - ".github/actions/core-artifact/**"
      - ".github/actions/node-workspace/**"
      - ".github/actions/rust-toolchain/**"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "web/**"
      - "identifiers/**"
      - "tooling/coverage-floor.*"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/backend.yml"
      - ".github/actions/core-artifact/**"
      - ".github/actions/node-workspace/**"
      - ".github/actions/rust-toolchain/**"
  # Daily, because a merge the gate skips writes no cache, and PRs restore main's.
  schedule:
    - cron: "23 4 * * *"

concurrency:
  group: backend-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # A merge whose tree a green PR run tested starts nothing (tooling/tree-proof.mjs).
  gate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/tree-proof.yml
    with:
      workflow: backend
      mode: gate

  test:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' }}
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '["ubuntu-latest"]' || vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node-workspace

      # The chat worker's core (decision 0081): the pinned build, checksum-verified.
      - uses: ./.github/actions/core-artifact
        with:
          target: web
          token: ${{ github.token }}

      - name: Types and OpenAPI drift
        run: pnpm --filter spjall-backend run check

      - name: The Worker builds, with the web app (cf build)
        run: pnpm --filter spjall-backend build

      - name: Tests in workerd, with coverage
        run: pnpm --filter spjall-backend coverage

      - name: Critical modules keep their coverage floor
        run: node tooling/coverage-floor.mjs backend

  # Named one by one: the default success() also reads the skipped gate above them.
  proof:
    needs: [test]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.test.result == 'success' }}
    uses: ./.github/workflows/tree-proof.yml
    with:
      workflow: backend
      mode: prove

name: backend

# The Worker spjall-api: types, the OpenAPI drift check, and its tests inside
# workerd. Path-filtered; the repo-wide seam and jurisdiction config checks
# run in ci.yml on every PR.
#
# No deploy job yet: D1 and R2 do not exist until Guðröður creates them with
# --jurisdiction eu, and a deploy before that would let wrangler
# auto-provision them without one (backend/wrangler.jsonc).

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "backend/**"
      - "api/**"
      - "identifiers/**"
      - "tooling/jurisdiction-check.mjs"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "identifiers/**"
      - ".github/workflows/backend.yml"

concurrency:
  group: backend-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: backend/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Types and OpenAPI drift
        run: pnpm run check

      - name: Tests in workerd
        run: pnpm test

  # Asks Cloudflare whether D1 and both R2 buckets exist in the EU
  # jurisdiction. Skipped until the read-only token is set, which happens when
  # the resources are created; from then on a missing or non-EU resource fails.
  jurisdiction:
    runs-on: ${{ fromJSON(vars.GUARD_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    env:
      CLOUDFLARE_JURISDICTION_TOKEN: ${{ secrets.CLOUDFLARE_JURISDICTION_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        if: env.CLOUDFLARE_JURISDICTION_TOKEN != ''

      - uses: actions/setup-node@v5
        if: env.CLOUDFLARE_JURISDICTION_TOKEN != ''
        with:
          node-version: 24

      - name: D1 and R2 report jurisdiction eu
        if: env.CLOUDFLARE_JURISDICTION_TOKEN != ''
        run: node tooling/jurisdiction-check.mjs --live

      - name: Not configured yet
        if: env.CLOUDFLARE_JURISDICTION_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_JURISDICTION_TOKEN is not set; the live check runs once D1 and R2 exist."

name: core

# The Rust core (core/, decision 0002).
#
# - test: formatting, clippy and the tests, on every change to the core.
# - publish: on a `core-vX.Y.Z` tag, builds the Android AAR (ubuntu, NDK from
#   core/artifact.lock.json) and the iOS XCFramework (macOS), and attaches both
#   zips with their SHA-256 files to a GitHub release of that tag (decision
#   0013). A released version is never overwritten. Nothing here edits the
#   lock: apps move to a new core through a PR that pins the printed checksums
#   in core/artifact.lock.json.

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "core/**"
      - "identifiers/**"
      - ".github/workflows/core.yml"
  push:
    branches: [main]
    paths:
      - "core/**"
      - "identifiers/**"
      - ".github/workflows/core.yml"
    tags: ["core-v*"]

concurrency:
  group: core-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '["ubuntu-latest"]' || vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rustup reads core/rust-toolchain.toml and installs the pinned toolchain.
      # The GCP fallback runners (vars.RUNNER_LABELS) have no rustup, so it is
      # bootstrapped there without a default toolchain.
      - name: Toolchain
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked --workspace

  android:
    if: startsWith(github.ref, 'refs/tags/core-v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag matches the workspace version
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' core/Cargo.toml | head -1)
          if [ "core-v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match core/Cargo.toml version $VERSION"
            exit 1
          fi

      - name: NDK from the lock, and cargo-ndk
        run: |
          NDK=$(jq -r .androidNdk core/artifact.lock.json)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK" > /dev/null
          cargo install cargo-ndk --version 4.1.2 --locked

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core

      - name: Build
        working-directory: core
        run: cargo xtask core android

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-android
          path: core/target/artifacts/
          if-no-files-found: error

  ios:
    if: startsWith(github.ref, 'refs/tags/core-v')
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core

      - name: Build
        working-directory: core
        run: cargo xtask core ios

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-ios
          path: core/target/artifacts/
          if-no-files-found: error

  publish:
    needs: [android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: core-*
          path: artifacts
          merge-multiple: true

      - name: Release the tag, never overwriting
        run: |
          VERSION=${GITHUB_REF_NAME#core-v}
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::$GITHUB_REF_NAME is already released; bump core/Cargo.toml and tag again"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "core $VERSION" \
            --notes "The Rust core $VERSION for the apps, pinned by checksum in core/artifact.lock.json."
          {
            echo "### core $VERSION published"
            echo "Pin it in \`core/artifact.lock.json\` by PR, with baseUrl"
            echo "\`https://github.com/$GITHUB_REPOSITORY/releases/download/core-v{version}\`:"
            echo '```'
            cat artifacts/*.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

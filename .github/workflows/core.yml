name: core

# The Rust core (core/, decision 0002).
#
# - test: formatting, clippy and the tests, on every change to the core.
# - wasm: the client engine still builds for a browser
#   (wasm32-unknown-unknown), so nothing native-only creeps in unnoticed. A
#   check, not a product: nothing ships for wasm32.
# - android, ios: build the Android AAR (NDK from core/artifact.lock.json)
#   and the iOS XCFramework (macOS), on a core PR and
#   on a `core-vX.Y.Z` tag. On the PR so a cross-compile break shows there,
#   not after a tag that can never be published again. The PR's zips are
#   kept under a name derived from the tree (tooling/core-reuse.mjs), and
#   the tag reuses them rather than building the same tree twice.
# - web: builds the browser module (core/wasm, decision 0081) with
#   wasm-bindgen into a zip beside the app ones, and fails when the committed
#   web/src/generated/core.d.ts is not what the build emits. Its tests (the
#   real OPFS pool) run in store-opfs.
# - publish: on the tag only, attaches the three zips with their SHA-256 files to
#   a GitHub release of that tag (decision 0013). A released version is never overwritten. Nothing here edits the
#   lock: apps move to a new core through a PR that pins the printed checksums
#   in core/artifact.lock.json.
#
# Where the jobs run (docs/testing.md, "Where CI runs"): every job but publish
# reads no secret, so it runs on the lane a repository variable names
# (RUNNER_LABELS, and MAC_RUNNER_LABELS for ios), and falls back to a hosted
# runner when the variable is unset or the PR comes from a fork. Each step therefore works on Linux x64 and macOS ARM64: binaries
# are picked from RUNNER_OS and RUNNER_ARCH, checksums use `shasum -a 256`, and
# the GitHub API is called with curl, since the Mac has no gh. publish stays on
# ubuntu-latest: it writes the release with a contents: write token.

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "core/**"
      - "api/fold-vectors.json"
      - "identifiers/**"
      - "tooling/coverage-floor.*"
      - ".github/workflows/core.yml"
      - ".github/actions/rust-toolchain/**"
  push:
    branches: [main]
    paths:
      - "core/**"
      - "api/fold-vectors.json"
      - "identifiers/**"
      - "tooling/coverage-floor.*"
      - ".github/workflows/core.yml"
      - ".github/actions/rust-toolchain/**"
    tags: ["core-v*"]

concurrency:
  group: core-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '["ubuntu-latest"]' || vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov

      # One instrumented run is the test run: llvm-cov runs every test once.
      - name: Tests, with coverage
        run: |
          rustup component add llvm-tools-preview
          mkdir -p ../coverage
          cargo llvm-cov --locked --workspace --json --summary-only --output-path ../coverage/core-summary.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Critical modules keep their coverage floor
        working-directory: .
        run: node tooling/coverage-floor.mjs core

  wasm:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    # sqlite-wasm-rs compiles SQLite with clang: ubuntu-latest has one with a
    # wasm32 backend, and on macOS the rust-toolchain action points it at
    # Homebrew's LLVM. A lane without either (the old GCP image) cannot run it.
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '["ubuntu-latest"]' || vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-toolchain
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core
          key: wasm32

      - name: Clippy for wasm32
        run: |
          cargo clippy --locked -p spjall-client --target wasm32-unknown-unknown -- -D warnings
          cargo clippy --locked -p spjall-wasm --all-targets --target wasm32-unknown-unknown -- -D warnings

  store-opfs:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    # The browser's store (0081): the core's store on `opfs-sahpool` under
    # headless Chrome, in a dedicated Worker, through sqlite3mc's cipher. The
    # one suite that runs the real VFS, so it is where a cipher or journal
    # regression shows. Release on purpose: `sqlite-wasm-vfs` 0.2.0 asserts in
    # `xClose` on sqlite3mc's second open of the same file, and release is what
    # the browser runs (core/store/tests/opfs.rs says the same).
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '["ubuntu-latest"]' || vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-toolchain
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core
          key: wasm32-opfs

      # The version here follows the wasm-bindgen crate in core/Cargo.lock; the
      # runner refuses a mismatch, so a bump of one is a bump of both.
      - name: wasm-bindgen-test-runner
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked

      # Chrome for Testing and its own driver, so the browser the tests drive is
      # the one whose driver ships beside it. No third-party action to pin. The
      # build is the runner's platform; on macOS the binary sits inside the .app.
      - name: Chrome and chromedriver
        working-directory: .
        run: |
          set -euo pipefail
          case "$RUNNER_OS/$RUNNER_ARCH" in
            Linux/X64) P=linux64; BIN=chrome-linux64/chrome ;;
            macOS/ARM64) P=mac-arm64 ;;
            macOS/X64) P=mac-x64 ;;
            *) echo "::error::no Chrome for Testing build for $RUNNER_OS/$RUNNER_ARCH"; exit 1 ;;
          esac
          if [ "$RUNNER_OS" = macOS ]; then
            BIN="chrome-$P/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing"
          fi
          V=$(curl -fsS https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json \
            | jq -r '.channels.Stable.version')
          B=https://storage.googleapis.com/chrome-for-testing-public/$V/$P
          curl -fsSO "$B/chrome-$P.zip"
          curl -fsSO "$B/chromedriver-$P.zip"
          unzip -q "chrome-$P.zip"
          unzip -q "chromedriver-$P.zip"
          test -x "$BIN"
          echo "CHROMEDRIVER=$PWD/chromedriver-$P/chromedriver" >> "$GITHUB_ENV"
          # The runner reads no CHROME variable: without a binary in the
          # capabilities the driver starts the image's own Chrome, whose
          # version is not the driver's. The runner adds its headless flags
          # to these options.
          jq -n --arg bin "$PWD/$BIN" \
            '{"goog:chromeOptions": {binary: $bin}}' > webdriver.json
          echo "WASM_BINDGEN_TEST_WEBDRIVER_JSON=$PWD/webdriver.json" >> "$GITHUB_ENV"

      - name: The store on the browser's VFS
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: cargo test --release --locked -p spjall-store --features opfs --target wasm32-unknown-unknown --test opfs

      # The browser core's own suite (0081): PoolBlobs on the real pool beside
      # the store. The transport's headers and ranges, the QR and the error
      # codes are pure functions and run in the `test` job natively.
      - name: The browser core on the browser's VFS
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: cargo test --release --locked -p spjall-wasm --target wasm32-unknown-unknown

  web:
    # The browser's core (0081): spjall-wasm and its JS glue, zipped like the
    # app ones. Built on a core PR so a break shows there, and on the tag.
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/core-v')
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '["ubuntu-latest"]' || vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/core-v')
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' core/Cargo.toml | head -1)
          if [ "core-v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match core/Cargo.toml version $VERSION"
            exit 1
          fi

      - uses: ./.github/actions/rust-toolchain
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core
          key: wasm32-web

      # Same version as the store-opfs job and the wasm-bindgen crate in
      # core/Cargo.lock: the glue and the module must come from one version.
      - name: wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked

      - name: Build
        working-directory: core
        run: cargo xtask core web

      # The committed declarations are what the web client is typed against.
      - name: The committed declarations are the built ones
        run: |
          CORE_WEB_BUILT=1 node tooling/core-guard.mjs || {
            diff -u web/src/generated/core.d.ts web/core/spjall_wasm.d.ts
            exit 1
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ startsWith(github.ref, 'refs/tags/') && 'core-web' || 'web-core-pr' }}
          path: core/target/artifacts/
          if-no-files-found: error
          retention-days: 90

  android:
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/core-v')
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '["ubuntu-latest"]' || vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/core-v')
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' core/Cargo.toml | head -1)
          if [ "core-v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match core/Cargo.toml version $VERSION"
            exit 1
          fi

      # Reuse (decision 0013, #36): the PR uploaded this zip under a name that
      # covers everything deciding its bytes, so the tag publishes the zip the
      # PR built and tested instead of building the same tree again. A miss
      # (a run expired, or a tag on a tree no PR built) builds as before.
      - name: Artifact name
        id: name
        run: echo "name=$(node tooling/core-reuse.mjs name android)" >> "$GITHUB_OUTPUT"

      - name: Find the PR's zip
        id: reuse
        if: startsWith(github.ref, 'refs/tags/core-v')
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.name.outputs.name }}
          REPO_ID: ${{ github.repository_id }}
        run: |
          RUN=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts?name=$NAME&per_page=100" \
            | node tooling/core-reuse.mjs pick "$NAME" "$REPO_ID")
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          if [ -n "$RUN" ]; then echo "Reusing $NAME from run $RUN"; else echo "No usable $NAME; building"; fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.reuse.outputs.run != ''
        with:
          name: ${{ steps.name.outputs.name }}
          run-id: ${{ steps.reuse.outputs.run }}
          github-token: ${{ github.token }}
          path: core/target/artifacts

      - name: Verify the reused zip
        if: steps.reuse.outputs.run != ''
        working-directory: core/target/artifacts
        run: shasum -a 256 -c spjall-core-android.zip.sha256

      - uses: ./.github/actions/rust-toolchain
        if: steps.reuse.outputs.run == ''

      # ANDROID_HOME is the hosted image's SDK, or on samtak-mac the Homebrew
      # SDK the runner's .env names (tooling/mac-bootstrap.sh). That one is
      # shared by both runners and keeps what it installs, so an NDK already
      # there is not installed again.
      - name: NDK from the lock, and cargo-ndk
        if: steps.reuse.outputs.run == ''
        run: |
          NDK=$(jq -r .androidNdk core/artifact.lock.json)
          if [ ! -d "$ANDROID_HOME/ndk/$NDK" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK" > /dev/null
          fi
          cargo install cargo-ndk --version 4.1.2 --locked

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.reuse.outputs.run == ''
        with:
          workspaces: core

      - name: Build
        if: steps.reuse.outputs.run == ''
        working-directory: core
        run: cargo xtask core android

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # The PR's upload carries the reuse name; the tag's carries the name
          # publish collects.
          name: ${{ startsWith(github.ref, 'refs/tags/') && 'core-android' || steps.name.outputs.name }}
          path: core/target/artifacts/
          if-no-files-found: error
          retention-days: 90

  ios:
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/core-v')
    # MAC_RUNNER_LABELS names samtak-mac; unset, or for a fork's PR, the job
    # runs on GitHub's hosted macOS.
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Reuse the PR's zip on the tag, as in the android job.
      - name: Artifact name
        id: name
        run: echo "name=$(node tooling/core-reuse.mjs name ios)" >> "$GITHUB_OUTPUT"

      - name: Find the PR's zip
        id: reuse
        if: startsWith(github.ref, 'refs/tags/core-v')
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.name.outputs.name }}
          REPO_ID: ${{ github.repository_id }}
        run: |
          RUN=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts?name=$NAME&per_page=100" \
            | node tooling/core-reuse.mjs pick "$NAME" "$REPO_ID")
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          if [ -n "$RUN" ]; then echo "Reusing $NAME from run $RUN"; else echo "No usable $NAME; building"; fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.reuse.outputs.run != ''
        with:
          name: ${{ steps.name.outputs.name }}
          run-id: ${{ steps.reuse.outputs.run }}
          github-token: ${{ github.token }}
          path: core/target/artifacts

      - name: Verify the reused zip
        if: steps.reuse.outputs.run != ''
        working-directory: core/target/artifacts
        run: shasum -a 256 -c spjall-core-ios.zip.sha256

      - uses: ./.github/actions/rust-toolchain
        if: steps.reuse.outputs.run == ''

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.reuse.outputs.run == ''
        with:
          workspaces: core

      - name: Build
        if: steps.reuse.outputs.run == ''
        working-directory: core
        run: cargo xtask core ios

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # The PR's upload carries the reuse name; the tag's carries the name
          # publish collects.
          name: ${{ startsWith(github.ref, 'refs/tags/') && 'core-ios' || steps.name.outputs.name }}
          path: core/target/artifacts/
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: [android, ios, web]
    if: startsWith(github.ref, 'refs/tags/core-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: core-*
          path: artifacts
          merge-multiple: true

      - name: Release the tag, never overwriting
        run: |
          VERSION=${GITHUB_REF_NAME#core-v}
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::$GITHUB_REF_NAME is already released; bump core/Cargo.toml and tag again"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "core $VERSION" \
            --notes "The Rust core $VERSION for the apps, pinned by checksum in core/artifact.lock.json."
          {
            echo "### core $VERSION published"
            echo "Pin it in \`core/artifact.lock.json\` by PR, with baseUrl"
            echo "\`https://github.com/$GITHUB_REPOSITORY/releases/download/core-v{version}\`:"
            echo '```'
            cat artifacts/*.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

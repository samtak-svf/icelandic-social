name: core

# The Rust core (core/, decision 0002).
#
# - test: formatting, clippy and the tests, on every change to the core.
# - publish: on a `core-vX.Y.Z` tag, builds the Android AAR (ubuntu, NDK from
#   core/artifact.lock.json) and the iOS XCFramework (macOS), and uploads both
#   zips with their SHA-256 files to R2 `spjall-artifacts` under
#   core/<version>/, in the EU jurisdiction. A published version is never
#   overwritten. Nothing here edits the lock: apps move to a new core through
#   a PR that pins the printed checksums in core/artifact.lock.json.
#
# The upload is skipped with a notice until R2_ARTIFACTS_TOKEN is set; the
# bucket is created by hand with --jurisdiction eu (backend/wrangler.jsonc).

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "core/**"
      - "identifiers/**"
      - ".github/workflows/core.yml"
  push:
    branches: [main]
    paths:
      - "core/**"
      - "identifiers/**"
      - ".github/workflows/core.yml"
    tags: ["core-v*"]

concurrency:
  group: core-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v5

      # rustup reads core/rust-toolchain.toml and installs the pinned toolchain.
      # The GCP fallback runners (vars.RUNNER_LABELS) have no rustup, so it is
      # bootstrapped there without a default toolchain.
      - name: Toolchain
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked --workspace

  android:
    if: startsWith(github.ref, 'refs/tags/core-v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Tag matches the workspace version
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' core/Cargo.toml | head -1)
          if [ "core-v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match core/Cargo.toml version $VERSION"
            exit 1
          fi

      - name: NDK from the lock, and cargo-ndk
        run: |
          NDK=$(jq -r .androidNdk core/artifact.lock.json)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK" > /dev/null
          cargo install cargo-ndk --version 4.1.2 --locked

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Build
        working-directory: core
        run: cargo xtask core android

      - uses: actions/upload-artifact@v4
        with:
          name: core-android
          path: core/target/artifacts/
          if-no-files-found: error

  ios:
    if: startsWith(github.ref, 'refs/tags/core-v')
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Build
        working-directory: core
        run: cargo xtask core ios

      - uses: actions/upload-artifact@v4
        with:
          name: core-ios
          path: core/target/artifacts/
          if-no-files-found: error

  publish:
    needs: [android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.R2_ARTIFACTS_TOKEN }}
      # The personal account in backend/wrangler.jsonc; not a secret.
      CLOUDFLARE_ACCOUNT_ID: af4d4a9c4527ce1e46d0c2dc1165e801
    steps:
      - uses: actions/checkout@v5
        if: env.CLOUDFLARE_API_TOKEN != ''

      - uses: actions/download-artifact@v5
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          pattern: core-*
          path: artifacts
          merge-multiple: true

      - name: Upload to R2 (EU jurisdiction), never overwriting
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          VERSION=${GITHUB_REF_NAME#core-v}
          BUCKET=$(jq -r .cloudflare.r2.artifacts identifiers/ids.json)
          WRANGLER="npx --yes wrangler@4.147.0"
          if $WRANGLER r2 object get "$BUCKET/core/$VERSION/spjall-core-android.zip.sha256" \
               --jurisdiction eu --remote --pipe > /dev/null 2>&1; then
            echo "::error::core/$VERSION is already published; bump core/Cargo.toml and tag again"
            exit 1
          fi
          for FILE in artifacts/*; do
            $WRANGLER r2 object put "$BUCKET/core/$VERSION/$(basename "$FILE")" \
              --file "$FILE" --jurisdiction eu --remote
          done
          {
            echo "### core $VERSION published"
            echo "Pin it in \`core/artifact.lock.json\` by PR:"
            echo '```'
            cat artifacts/*.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Not configured yet
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::R2_ARTIFACTS_TOKEN is not set; the artifacts were built but not uploaded."

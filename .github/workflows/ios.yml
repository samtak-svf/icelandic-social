name: ios

# The iOS skeleton (ios/): swift-format, then an unsigned simulator build and
# the unit tests. The repo is public, so hosted macOS runners cost nothing
# (decision 0012); the path filter lists what the iOS build reads, and the
# manual trigger reruns it on demand.
#
# The core is the published release core/artifact.lock.json pins, fetched and
# checksum-verified by cargo xtask fetch (decision 0013); this workflow never
# builds it. Xcode never calls cargo itself (tooling/core-guard.mjs).

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "ios/**"
      - "brand/**"
      - "identifiers/**"
      - "api/**"
      - "core/artifact.lock.json"
      - "core/xtask/**"
      - "core/rust-toolchain.toml"
      - ".github/workflows/ios.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "brand/**"
      - "identifiers/**"
      - "api/**"
      - "core/artifact.lock.json"
      - "core/xtask/**"
      - "core/rust-toolchain.toml"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Format
        working-directory: ios
        run: xcrun swift-format lint --strict --recursive App NotificationService Shared Tests Packages/SpjallAPI

      - name: Toolchain
        working-directory: core
        run: rustup toolchain install

      - name: Core (pinned, checksum-verified)
        working-directory: core
        run: cargo xtask fetch ios

      - name: Generate the Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      # ios-testflight.yml is the only workflow that signs, and it runs by hand,
      # so a target-level setting that overrides a project-level one (XcodeGen's
      # iOS preset sets CODE_SIGN_IDENTITY and TARGETED_DEVICE_FAMILY on each
      # target) surfaced only there, or at App Store Connect.
      - name: Interim signs with the distribution identity, for iPhone only
        working-directory: ios
        run: |
          fail=0
          for target in Spjall NotificationService; do
            settings=$(xcodebuild -showBuildSettings -project Spjall.xcodeproj \
              -target "$target" -configuration Interim -sdk iphoneos -skipPackagePluginValidation 2>/dev/null)
            for want in "CODE_SIGN_IDENTITY = Apple Distribution" "CODE_SIGN_STYLE = Manual" "DEVELOPMENT_TEAM = B4724Z74TM" "TARGETED_DEVICE_FAMILY = 1"; do
              if ! grep -qxF "    $want" <<<"$settings"; then
                echo "::error::$target (Interim): want '$want', got '$(grep -E "^    ${want%% =*} = " <<<"$settings" | sed 's/^ *//')'"
                fail=1
              fi
            done
          done
          # Interim takes push through the interim team's APNs key (decision 0011).
          settings=$(xcodebuild -showBuildSettings -project Spjall.xcodeproj \
            -target Spjall -configuration Interim -sdk iphoneos -skipPackagePluginValidation 2>/dev/null)
          for want in "CODE_SIGN_ENTITLEMENTS = App/Spjall.entitlements" "SPJALL_APS_ENVIRONMENT = production"; do
            if ! grep -qxF "    $want" <<<"$settings"; then
              echo "::error::Spjall (Interim): want '$want', got '$(grep -E "^    ${want%% =*} = " <<<"$settings" | sed 's/^ *//')'"
              fail=1
            fi
          done
          exit $fail

      - name: Pick an available iPhone simulator
        run: |
          SIM_UDID=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | startswith("com.apple.CoreSimulator.SimRuntime.iOS-")) | {runtime: .key, devices: [.value[] | select(.name | startswith("iPhone"))]} | select(.devices | length > 0)] | sort_by(.runtime) | (last // {}) | (.devices // []) | .[0] | .udid? // empty')
          if [ -z "$SIM_UDID" ]; then
            xcrun simctl list devices available
            echo "::error::no available iPhone simulator"
            exit 1
          fi
          echo "SIM_UDID=$SIM_UDID" >> "$GITHUB_ENV"

      # -skipPackagePluginValidation: swift-openapi-generator's build plugin
      # would otherwise wait for a trust prompt no CI runner can answer.
      # Signed ad hoc ("Sign to Run Locally", no team): an unsigned app has no
      # application identifier, and the simulator's Keychain refuses it
      # (errSecMissingEntitlement), which the store key test needs.
      - name: Build and test (simulator, signed ad hoc)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test \
            -project Spjall.xcodeproj \
            -scheme Spjall \
            -destination "id=$SIM_UDID" \
            -configuration Debug \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            | tee "$RUNNER_TEMP/xcodebuild-test.log" | xcpretty

      - name: Fail when no tests ran
        run: grep -E 'Executed [1-9][0-9]* tests?, with 0 failures' "$RUNNER_TEMP/xcodebuild-test.log"

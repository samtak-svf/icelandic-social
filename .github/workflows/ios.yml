name: ios

# The iOS skeleton (ios/): swift-format, then an unsigned simulator build and
# the unit tests. The repo is public, so hosted macOS runners cost nothing
# (decision 0012); the path filter lists what the iOS build reads, and the
# manual trigger reruns it on demand.
#
# The core is the published release core/artifact.lock.json pins, fetched and
# checksum-verified by cargo xtask fetch (decision 0013); this workflow never
# builds it. Xcode never calls cargo itself (tooling/core-guard.mjs).

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "ios/**"
      - "brand/**"
      - "identifiers/**"
      - "api/**"
      - "core/artifact.lock.json"
      - "core/xtask/**"
      - "core/rust-toolchain.toml"
      - ".github/workflows/ios.yml"
      - ".github/actions/core-artifact/**"
      - ".github/actions/rust-toolchain/**"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "brand/**"
      - "identifiers/**"
      - "api/**"
      - "core/artifact.lock.json"
      - "core/xtask/**"
      - "core/rust-toolchain.toml"
      - ".github/workflows/ios.yml"
      - ".github/actions/core-artifact/**"
      - ".github/actions/rust-toolchain/**"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # A merge whose tree a green PR run tested starts nothing (tooling/tree-proof.mjs).
  gate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/tree-proof.yml
    with:
      workflow: ios
      mode: gate

  build:
    # MAC_RUNNER_LABELS names a Mac of Samtak's own (tooling/mac-bootstrap.sh);
    # unset, or for a fork's PR, the job runs on GitHub's hosted macOS.
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' }}
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '["macos-26"]' || vars.MAC_RUNNER_LABELS || '["macos-26"]') }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Format
        run: ios/scripts/lint.sh

      - uses: ./.github/actions/core-artifact
        with:
          target: ios
          token: ${{ github.token }}

      - name: Generate the Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      # ios-testflight.yml is the only workflow that signs, and it runs by hand,
      # so a target-level setting that overrides a project-level one (XcodeGen's
      # iOS preset sets CODE_SIGN_IDENTITY and TARGETED_DEVICE_FAMILY on each
      # target) surfaced only there, or at App Store Connect.
      - name: Interim signs with the distribution identity, for iPhone and iPad
        working-directory: ios
        run: |
          fail=0
          for target in Spjall NotificationService; do
            settings=$(xcodebuild -showBuildSettings -project Spjall.xcodeproj \
              -target "$target" -configuration Interim -sdk iphoneos -skipPackagePluginValidation 2>/dev/null)
            for want in "CODE_SIGN_IDENTITY = Apple Distribution" "CODE_SIGN_STYLE = Manual" "DEVELOPMENT_TEAM = B4724Z74TM" "TARGETED_DEVICE_FAMILY = 1,2"; do
              if ! grep -qxF "    $want" <<<"$settings"; then
                echo "::error::$target (Interim): want '$want', got '$(grep -E "^    ${want%% =*} = " <<<"$settings" | sed 's/^ *//')'"
                fail=1
              fi
            done
          done
          # Interim takes push through the interim team's APNs key (decision 0011).
          # An app built for the iPad must turn every way there, or App Store
          # Connect refuses the upload (90474).
          settings=$(xcodebuild -showBuildSettings -project Spjall.xcodeproj \
            -target Spjall -configuration Interim -sdk iphoneos -skipPackagePluginValidation 2>/dev/null)
          for want in "CODE_SIGN_ENTITLEMENTS = App/Spjall.entitlements" "SPJALL_APS_ENVIRONMENT = production" \
            "INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad = UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"; do
            if ! grep -qxF "    $want" <<<"$settings"; then
              echo "::error::Spjall (Interim): want '$want', got '$(grep -E "^    ${want%% =*} = " <<<"$settings" | sed 's/^ *//')'"
              fail=1
            fi
          done
          exit $fail

      # The script also fails when no test ran.
      - name: Build and test (simulator, signed ad hoc)
        run: ios/scripts/test.sh
        env:
          GITHUB_TOKEN: ${{ github.token }} # the script fetches the core again on a fresh checkout

      # xcpretty prints only the first line of a diagnostic; a conformance
      # failure then hides the error that caused it, which only the raw log has.
      - name: Show the compiler's errors
        if: failure()
        run: |
          grep -E -A6 '(error|note): ' "$RUNNER_TEMP/xcodebuild-test.log" | head -200 || true

  # Named one by one: the default success() also reads the skipped gate above them.
  proof:
    needs: [build]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.build.result == 'success' }}
    permissions:
      contents: read
      actions: read # asked of the whole called file, though only its gate job reads
    uses: ./.github/workflows/tree-proof.yml
    with:
      workflow: ios
      mode: prove

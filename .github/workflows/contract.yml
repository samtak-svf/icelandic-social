name: contract

# The API contract (decision 0005): api/openapi.json is what the zod schemas
# in backend/src/api/ generate, the web client is what that spec emits, and nothing breaks against the base branch unless the PR carries
# the label `api: breaking`.

permissions:
  contents: read

on:
  pull_request:
    # labeled/unlabeled so adding `api: breaking` re-runs the breaking check.
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "backend/src/**"
      - "backend/scripts/openapi.ts"
      - "backend/package.json"
      - "api/**"
      - "tooling/web-api.mjs"
      - "web/src/generated/api.ts"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/contract.yml"

concurrency:
  group: contract-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '["ubuntu-latest"]' || vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Per runner: the Mac's two runners share one home directory.
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: api/openapi.json matches the zod schemas
        run: node backend/scripts/openapi.ts --check

      - name: The web client matches api/openapi.json
        run: node tooling/web-api.mjs --check

  breaking:
    if: "!contains(github.event.pull_request.labels.*.name, 'api: breaking')"
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '["ubuntu-latest"]' || vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    env:
      OASDIFF_VERSION: 1.33.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: No breaking change against the base branch
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          set -euo pipefail
          if ! git show "$BASE:api/openapi.json" > "$RUNNER_TEMP/base-openapi.json" 2>/dev/null; then
            echo "::notice::$BASE has no api/openapi.json yet; nothing to break."
            exit 0
          fi
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) asset=linux_amd64 ;;
            macOS-ARM64) asset=darwin_all ;;
            *) echo "::error::no oasdiff build for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
          esac
          curl -sSfL "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_${asset}.tar.gz" | tar -xz oasdiff
          ./oasdiff breaking "$RUNNER_TEMP/base-openapi.json" api/openapi.json --fail-on ERR

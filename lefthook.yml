# Local gates. Every one of them also runs in CI (.github/workflows/ci.yml),
# because a local hook is absent on a machine that never ran `pnpm install`.
# Never bypass with --no-verify (AGENTS.md § Git).

pre-commit:
  parallel: true
  commands:
    branch-protection:
      run: |
        BRANCH=$(git rev-parse --abbrev-ref HEAD)
        if [ "$BRANCH" = "main" ]; then
          echo "❌ Direct commits to main are not allowed. Create a feature branch."
          exit 1
        fi

    ai-authorship:
      # A real co-author line carries an email; prose describing the marker
      # does not, and is not flagged.
      glob: "*.{ts,tsx,js,mjs,jsx,kt,kts,swift,rs,md,toml,json,yml,yaml}"
      run: |
        for f in {staged_files}; do
          case "$f" in
            lefthook.yml|.github/workflows/*) continue ;;
          esac
          if grep -iE "Co-Authored-By:[[:space:]]+(Claude|GPT|Copilot|Anthropic|OpenAI|Gemini|AI)[^<]*<[^>]+@" "$f" 2>/dev/null; then
            echo "❌ AI authorship marker in $f"
            exit 1
          fi
        done

    secret-detection:
      run: gitleaks git --pre-commit --staged --redact --verbose --config .gitleaks.toml

    # Kennitölur and phone numbers. gitleaks cannot see them (a kennitala is
    # not a secret shape). Pre-commit, because once one is in a commit taking
    # it out means rewriting history.
    pii:
      run: node tooling/pii-guard.mjs --staged

    format:
      glob: "*.{js,mjs,ts,json,jsonc,toml,yml,yaml,md}"
      run: pnpm exec oxfmt --write {staged_files}
      stage_fixed: true

    lint:
      glob: "*.{js,mjs,ts}"
      # A commit whose only scripts are ignored (generated) ones lints nothing.
      run: pnpm exec oxlint --no-error-on-unmatched-pattern {staged_files}

pre-push:
  parallel: true
  commands:
    block-main:
      run: |
        BRANCH=$(git rev-parse --abbrev-ref HEAD)
        if [ "$BRANCH" = "main" ]; then
          echo "❌ Direct pushes to main are not allowed. Use a PR."
          exit 1
        fi

    # The frozen ids: equal to the lock, and a lock change since main carries
    # a decision record (docs/decisions/0004).
    ids-freeze:
      run: |
        git fetch -q origin main 2>/dev/null || true
        node tooling/ids-freeze.mjs --base origin/main

    brand:
      run: node tooling/brand-check.mjs

    # The committed platform outputs match the active brand byte for byte.
    brand-gen:
      run: node tooling/brand-gen.mjs --check

    brand-leak:
      run: node tooling/brand-leak-guard.mjs

    # House style drops the þankastrik in both lengths; the UNSPACED en dash
    # is a millistrik and is left alone.
    thankastrik:
      run: node tooling/thankastrik.mjs

    # Bindings and DO stubs only in backend/src/env/, every stub pinned to
    # the EU; wrangler.jsonc names the frozen ids with jurisdiction eu.
    seams:
      run: node tooling/seam-guard.mjs

    jurisdiction:
      run: node tooling/jurisdiction-check.mjs

    # Actions pinned by SHA, fork PRs never on the org runners.
    workflows:
      run: node tooling/workflow-guard.mjs

    # The core lock is well formed and no Gradle or Xcode file calls cargo.
    core:
      run: node tooling/core-guard.mjs

    # Rust formatting and lints, only when the core changed since main.
    core-rust:
      run: |
        if git diff --quiet origin/main...HEAD -- core/ 2>/dev/null; then exit 0; fi
        cd core && cargo fmt --all --check && cargo clippy --quiet --workspace --all-targets -- -D warnings

    # The contract: spec matches zod, Kotlin matches spec.
    contract:
      run: node backend/scripts/openapi.ts --check && node tooling/ws-kotlin.mjs --check

    typecheck:
      run: pnpm run typecheck

    test:
      run: pnpm test

commit-msg:
  commands:
    ai-authorship:
      run: |
        if grep -iE "(^🤖|[[:space:]]🤖|Generated with.*(Claude|AI|Copilot)|Co-Authored-By:.*(Claude|AI|Copilot|Anthropic|OpenAI|GitHub Copilot|Gemini)|Author:.*(Claude|AI|Copilot))" {1} > /dev/null; then
          echo "❌ AI authorship marker in commit message — commits list only human authors"
          exit 1
        fi
